<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="LexAgent pipeline: document to two parallel agents, a cross-verifier, a chief analyst and a PDF report">
  <rect x="1" y="1" width="1198" height="468" fill="#0b0b0b" stroke="#f2f2f2" stroke-width="2"/>
  <path d="M200 235 C 250 235, 250 120, 300 120" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M200 235 C 250 235, 250 120, 300 120"/></circle>
  <path d="M200 235 C 250 235, 250 350, 300 350" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="2.2s" begin="0.25s" repeatCount="indefinite" path="M200 235 C 250 235, 250 350, 300 350"/></circle>
  <path d="M560 120 C 610 120, 600 235, 650 235" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M560 120 C 610 120, 600 235, 650 235"/></circle>
  <path d="M560 350 C 610 350, 600 235, 650 235" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="2.2s" begin="1.35s" repeatCount="indefinite" path="M560 350 C 610 350, 600 235, 650 235"/></circle>
  <path d="M770 275 L770 345" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="1.6s" begin="2.4s" repeatCount="indefinite" path="M770 275 L770 345"/></circle>
  <path d="M890 385 C 960 385, 950 235, 1010 235" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
  <circle r="5.5" fill="#f2f2f2"><animateMotion dur="1.8s" begin="3s" repeatCount="indefinite" path="M890 385 C 960 385, 950 235, 1010 235"/></circle>

  <g transform="translate(40 160)">
    <rect width="160" height="150" fill="#121212" stroke="#f2f2f2" stroke-width="1.5"/>
    <text x="22" y="40" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2.6" fill="#f2f2f2" >CASE FILE</text>
    <rect x="22" y="58" width="116" height="6" fill="#2a2a2a"/><rect x="22" y="76" width="116" height="6" fill="#2a2a2a"/><rect x="22" y="94" width="116" height="6" fill="#2a2a2a"/><rect x="22" y="112" width="70" height="6" fill="#2a2a2a"/>
    <text x="80" y="176" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="1" fill="#9a9a9a">PDF · DOCX · TXT</text>
  </g>

  <text x="430" y="242" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2.6" fill="#9a9a9a" text-anchor="middle">IN PARALLEL</text>
  <path d="M430 160 L430 220 M430 255 L430 312" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="5 6"/>

  <g transform="translate(300 80)">
      <rect width="260" height="80" fill="#121212" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect width="4" height="80" fill="#f2f2f2"/>
      <circle cx="34" cy="40" r="17" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
      <text x="34" y="46.46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.549999999999997" fill="#f2f2f2">1</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="700" fill="#f2f2f2">Summarizer</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#9a9a9a">Plain-language summary</text>
    </g>
  <g transform="translate(300 310)">
      <rect width="260" height="80" fill="#121212" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect width="4" height="80" fill="#f2f2f2"/>
      <circle cx="34" cy="40" r="17" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
      <text x="34" y="46.46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.549999999999997" fill="#f2f2f2">2</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="700" fill="#f2f2f2">Legal Analyst</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#9a9a9a">Facts · issues · Acts &amp; sections</text>
    </g>
  <g transform="translate(650 195)">
      <rect width="240" height="80" fill="#121212" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect width="4" height="80" fill="#f2f2f2"/>
      <circle cx="34" cy="40" r="17" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
      <text x="34" y="46.46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.549999999999997" fill="#f2f2f2">3</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="700" fill="#f2f2f2">Cross-Verifier</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#9a9a9a">Agreements · gaps · confidence</text>
    </g>
  <g transform="translate(650 345)">
      <rect width="240" height="80" fill="#121212" stroke="#2a2a2a" stroke-width="1.5"/>
      <rect width="4" height="80" fill="#f2f2f2"/>
      <circle cx="34" cy="40" r="17" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
      <text x="34" y="46.46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.549999999999997" fill="#f2f2f2">4</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="17" font-weight="700" fill="#f2f2f2">Chief Analyst</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#9a9a9a">Final structured analysis</text>
    </g>

  <g transform="translate(1010 165)">
    <rect width="150" height="140" fill="#f2f2f2"/>
    <text x="75" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#0b0b0b">PDF</text>
    <text x="75" y="92" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="2.5" fill="#0b0b0b">REPORT</text>
    <text x="75" y="114" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="11" fill="#0b0b0b" opacity="0.7">with LexAgent seal</text>
  </g>

  <text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#f2f2f2">How a case moves through <tspan font-style="italic">LexAgent</tspan></text>
  <text x="40" y="448" font-family="'Segoe UI', Helvetica, Arial, 'Nirmala UI', 'Noto Sans Devanagari', sans-serif" font-size="13.5" fill="#9a9a9a">Each agent's result streams to the dashboard the moment it finishes · decision support only, never a verdict</text>
</svg>
