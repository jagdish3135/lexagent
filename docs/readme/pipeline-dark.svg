<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="LexAgent pipeline: document to two parallel agents, a cross-verifier, a chief analyst and a PDF report">
  <rect width="1200" height="470" rx="24" fill="#0b1220"/>
  <path d="M200 235 C 250 235, 250 120, 300 120" fill="none" stroke="#26324b" stroke-width="2.5"/>
    <circle r="6" fill="#8db2ff"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M200 235 C 250 235, 250 120, 300 120"/></circle>
<path d="M200 235 C 250 235, 250 350, 300 350" fill="none" stroke="#26324b" stroke-width="2.5"/>
    <circle r="6" fill="#f7c35c"><animateMotion dur="2.2s" begin="0.25s" repeatCount="indefinite" path="M200 235 C 250 235, 250 350, 300 350"/></circle>
<path d="M560 120 C 610 120, 600 235, 650 235" fill="none" stroke="#26324b" stroke-width="2.5"/>
    <circle r="6" fill="#8db2ff"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M560 120 C 610 120, 600 235, 650 235"/></circle>
<path d="M560 350 C 610 350, 600 235, 650 235" fill="none" stroke="#26324b" stroke-width="2.5"/>
    <circle r="6" fill="#f7c35c"><animateMotion dur="2.2s" begin="1.35s" repeatCount="indefinite" path="M560 350 C 610 350, 600 235, 650 235"/></circle>

  <g transform="translate(40 160)">
    <rect width="160" height="150" rx="16" fill="#121a2b" stroke="#26324b" stroke-width="1.5"/>
    <text x="22" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#f2b661">CASE FILE</text>
    <rect x="22" y="58" width="116" height="8" rx="4" fill="#26324b"/><rect x="22" y="76" width="116" height="8" rx="4" fill="#26324b"/><rect x="22" y="94" width="116" height="8" rx="4" fill="#26324b"/><rect x="22" y="112" width="70" height="8" rx="4" fill="#26324b"/>
    <text x="80" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a3acbd">PDF · DOCX · TXT</text>
  </g>

  <text x="430" y="242" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#a3acbd">IN PARALLEL</text>
  <path d="M430 160 L430 220 M430 255 L430 312" stroke="#26324b" stroke-width="2" stroke-dasharray="5 6"/>

  <g transform="translate(300 80)">
      <rect width="260" height="80" rx="16" fill="#121a2b" stroke="#26324b" stroke-width="1.5"/>
      <rect width="260" height="7" rx="3.5" fill="#8db2ff"/>
      <circle cx="34" cy="43" r="17" fill="#16264a"/>
      <text x="34" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#8db2ff">1</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ede7da">Summarizer</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3acbd">Plain-language summary</text>
    </g>
  <g transform="translate(300 310)">
      <rect width="260" height="80" rx="16" fill="#121a2b" stroke="#26324b" stroke-width="1.5"/>
      <rect width="260" height="7" rx="3.5" fill="#f7c35c"/>
      <circle cx="34" cy="43" r="17" fill="#2e2512"/>
      <text x="34" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#f7c35c">2</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ede7da">Legal Analyst</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3acbd">Facts · issues · Acts &amp; sections</text>
    </g>
  <g transform="translate(650 195)">
      <rect width="240" height="80" rx="16" fill="#121a2b" stroke="#26324b" stroke-width="1.5"/>
      <rect width="240" height="7" rx="3.5" fill="#6bd99a"/>
      <circle cx="34" cy="43" r="17" fill="#12301f"/>
      <text x="34" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#6bd99a">3</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ede7da">Cross-Verifier</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3acbd">Agreements · gaps · confidence</text>
    </g>
  <path d="M770 275 L770 345" fill="none" stroke="#26324b" stroke-width="2.5"/>
  <circle r="6" fill="#6bd99a"><animateMotion dur="1.6s" begin="2.4s" repeatCount="indefinite" path="M770 275 L770 345"/></circle>
  <g transform="translate(650 345)">
      <rect width="240" height="80" rx="16" fill="#121a2b" stroke="#26324b" stroke-width="1.5"/>
      <rect width="240" height="7" rx="3.5" fill="#ff8a7a"/>
      <circle cx="34" cy="43" r="17" fill="#3a1714"/>
      <text x="34" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#ff8a7a">4</text>
      <text x="62" y="39" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ede7da">Chief Analyst</text>
      <text x="62" y="59" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a3acbd">Final structured analysis</text>
    </g>
  <path d="M890 385 C 960 385, 950 235, 1010 235" fill="none" stroke="#26324b" stroke-width="2.5"/>
  <circle r="6" fill="#ff8a7a"><animateMotion dur="1.8s" begin="3s" repeatCount="indefinite" path="M890 385 C 960 385, 950 235, 1010 235"/></circle>

  <g transform="translate(1010 165)">
    <rect width="150" height="140" rx="16" fill="#1e2d52"/>
    <text x="75" y="64" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f2b661">PDF</text>
    <text x="75" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.85">REPORT</text>
    <text x="75" y="114" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">with LexAgent badge</text>
  </g>

  <text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#ede7da">How a case moves through LexAgent</text>
  <text x="40" y="448" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a3acbd">Each agent's result streams to the dashboard the moment it finishes · decision support only, never a verdict</text>
</svg>
